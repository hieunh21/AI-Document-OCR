[project]
name = "vietdocai"
version = "0.1.0"
description = "Vietnamese receipt intelligence: OCR + key information extraction on MC-OCR 2021"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pillow>=10.4",
    "opencv-contrib-python>=4.10",  # same distribution PaddleX installs (one cv2 only)
    "rapidfuzz>=3.9",
    "sqlalchemy>=2.0.30,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "lightgbm>=4.5,<5",  # learned KIE span classifier
]

[project.optional-dependencies]
# OCR stack is heavy; CPU-only variant below. GPU + VietOCR need custom indexes and
# --no-deps steps: follow docs/setup_gpu.md instead.
ocr = [
    "paddlepaddle>=3.3,<4",
    "paddleocr>=3.7,<4",
]
llm = [
    "google-genai>=1.0",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]
addopts = "-q"
markers = [
    "dataset: tests that need the licensed MC-OCR data under data/raw (skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "scripts/build_finetune_notebook.py"]  # Colab-style cells

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools]
packages = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Body", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["ai", "evaluation", "app", "tests"]
